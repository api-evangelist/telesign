name: Telesign
description: Telesign provides a comprehensive suite of communications and security APIs enabling businesses to
  verify phone numbers, send SMS, omnichannel and voice messages, and assess fraud risk. The developer portal publishes
  22 OpenAPI contracts (65 operations) covering SMS Verify, Voice Verify, Silent Verify, App Verify and the multi-channel
  Verify API; Messaging (SMS, WhatsApp, Viber, RCS, MMS, email), Voice, Number Masking and Bulk SMS; Phone ID, Intelligence
  Cloud and Email Intelligence risk signals; and Accounts, Deactivated Numbers, Flow Builder and Protect Platform
  management surfaces, plus an RFC 9727 API catalog and callback (webhook) payload contracts.
