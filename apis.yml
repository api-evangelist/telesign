name: Telesign
description: >-
  Telesign provides a comprehensive suite of communications and security APIs enabling businesses to verify phone
  numbers, send SMS and voice messages, and assess fraud risk. Core offerings include SMS messaging, voice calls,
  multi-channel verification (OTP/MFA), phone number intelligence (PhoneID), reputation scoring, and silent
  verification. Telesign serves thousands of enterprises globally for account security, fraud prevention, and customer
  communications.
