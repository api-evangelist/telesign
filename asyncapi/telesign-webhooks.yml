api: Telesign Messaging, SMS Verify and Verify APIs
summary: Telesign delivers transaction status (delivery reports), inbound-message and template-management callbacks as HTTPS POSTs to a callback URL registered per account (or passed as callback_url where
  enabled). The provider publishes the callback payloads as three OpenAPI documents whose server is the customer receiver (https://your-callback-url.com); no AsyncAPI document is published. Every callback
  is signed with HMAC-SHA256 using the account API Key.
asyncapi_published: false
delivery:
  transport: https-post
  content_type: application/json
  signature:
    algorithm: HMAC-SHA256
    headers:
    - Authorization
    - X-TS-Authorization
    format: 'Authorization: TSA {Customer ID}:{base64(HMAC-SHA256(base64decode(API Key), raw body))}; X-TS-Authorization carries the bare signature'
    docs: https://developer.telesign.com/enterprise/docs/authenticate-callbacks
  retries: true
  retry_policy: For SMS and the SMS Verify API, Telesign makes up to four attempts to deliver your callback notification; each attempt waits 5 seconds for an HTTP response, and a non-200 response is followed
    by an additional wait of 5, 10 and then 15 seconds before the next attempt; the 4th attempt is final.
  timeout_seconds: 5
  expected_response: HTTP 200
  dedup_field: reference_id
  common_fields:
  - reference_id
  - status.code
  - status.description
  - status.updated_on
  - submit_timestamp
  docs: https://developer.telesign.com/enterprise/docs/transaction-callback-service
