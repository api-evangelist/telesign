callback_authentication:
  description: Telesign signs every callback it sends with HMAC-SHA256 over the request body using the customer's base64-decoded API Key; the signature is sent in both the Authorization header ("TSA {Customer ID}:{signature}") and X-TS-Authorization. Receivers recompute and compare the signature.
  docs: https://developer.telesign.com/enterprise/docs/authenticate-callbacks
  headers:
  - Authorization
  - X-TS-Authorization
  algorithm: HMAC-SHA256
