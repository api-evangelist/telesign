- name: Digest
  type: apiKey
  in: header
  header: Authorization
  description: 'Telesign''s own HMAC request-signing scheme (not RFC 7616): the client builds a string-to-sign from the HTTP method, content type, date (Date or x-ts-date), x-ts-auth-method, x-ts-nonce and the resource path, signs it with the base64-decoded API Key using HMAC-SHA256 (HMAC-SHA1 also accepted), and sends "Authorization: TSA {Customer ID}:{signature}". Recommended for production; the SDKs implement it.'
