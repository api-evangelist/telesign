rate_limit_signaling:
  http_status: 429
  headers: []
  body_codes: [-40007, 3204, 5204, 10019]
  note: Exhaustion is reported in the JSON body (status.code 500 "Transaction not attempted" with an error code such as -40007 Rate Limit Exceeded); no RateLimit-* or Retry-After header is documented.
