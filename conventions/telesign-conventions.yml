authentication:
  style: 'Customer ID + API Key sent as HTTP Basic, or Telesign "Digest" (HMAC-SHA256 request signature in Authorization: TSA {Customer ID}:{signature} with x-ts-date, x-ts-auth-method and x-ts-nonce headers); Bearer token for the Protect Platform.'
  docs: https://developer.telesign.com/enterprise/docs/authentication
  artifact: authentication/telesign-authentication.yml
idempotency:
  coverage: none
  mechanism: null
  header: null
  docs: https://developer.telesign.com/enterprise/docs/authentication
  note: >-
    No Idempotency-Key or equivalent replay-safe retry mechanism is documented for any write (sendSMS, sendSMSVerifyCode,
    sendVoiceVerifyCode, createVerificationProcess, sendAdvancedMessage, sendBulkSMS, createMaskedSMSSession ...). The
    x-ts-nonce header used by Digest authentication rejects a reused nonce (error 10002 "'x-ts-nonce' header value has been
    used recently"), which prevents replay of a captured signature but does not make a client retry idempotent: a retried
    send with a fresh nonce sends a second message.
reversibility:
  grade: none
  write_surface:
  - operationId: sendSMS
    reversal: null
    note: An SMS, voice call or omnichannel message, once accepted, cannot be recalled through the API; getSMSStatus / getMessagingStatus only report delivery.
  - operationId: createVerificationProcess
    reversal: updateVerificationProcess
    window: null
    note: 'PATCH /verification/{reference_id}/state accepts only action "finalize" ("Finalize this verification process. Telesign either verifies or rejects at this stage"); no cancel action is documented.'
  - operationId: createMsgTemplate
    reversal: deleteMsgTemplate
    window: null
    note: A template can be deleted, but deletion is itself a write with no documented restore.
  - operationId: createMaskedSMSSession
    reversal: null
    note: Masked sessions are time-limited by the session parameters; no explicit end-session operation is published.
  - operationId: post-accounts-account_id-keys-rest
    reversal: delete-accounts-account_id-keys-rest-key_id
    window: null
    note: API keys can be deleted or patched (status), with no documented restore.
  dry_run: null
  dry_run_note: No dry-run or test mode is documented; the API Explorer charges the account for every request.
