webhooks:
  signature: 'HMAC-SHA256 over the body with the base64-decoded API Key, in Authorization ("TSA {Customer ID}:{signature}") and X-TS-Authorization'
  retries: up to four attempts, 5 second response timeout, waits of 5, 10 and 15 seconds between attempts (SMS and SMS Verify API)
  docs: https://developer.telesign.com/enterprise/docs/transaction-callback-service
