format: telesign-status-and-error-codes
envelope:
  description: Every Telesign JSON response carries reference_id, status{updated_on, code, description} and errors[{code, description}]. Status codes are three or four digits and product-scoped (1xx Voice
    Verify API; 2xx SMS Verify API and SMS; 3xx Phone ID and Intelligence; 20xx/24xx App Verify API; 28xx Phone ID identity signals; 5xx multiple products). Error codes are five digits, positive or negative,
    and shared across products. Telesign recommends coding against status.code and errors[].code rather than the HTTP status or the description text.
  fields:
  - reference_id
  - status.updated_on
  - status.code
  - status.description
  - errors[].code
  - errors[].description
  http_statuses:
  - 200
  - 201
  - 400
  - 401
  - 402
  - 404
  - 405
  - 429
  - 500
  - 503
status_code_count: 179
error_code_count: 159
