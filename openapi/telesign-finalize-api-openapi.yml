    post:
      description: 'If a Telesign App Verify API call is unsuccessful, the device will not receive the call. If there is a prefix sent by Telesign in the initiate request and it cannot be matched to the CLI of the verification call, you can use use this endpoint to report the issue to Telesign for troubleshooting.


        To add this product to your account, contact a Telesign expert. This product is available for full-service accounts only.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) and Digest

        * **Encoding:** Accepts only UTF-8 encoded unicode characters as inputs

        * **Accepts:** `application/x-www-form-urlencoded`

        * **Required headers:** `Content-Type - application/x-www-form-urlencoded`

        * **Rate limit:** Default rate limits by product'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                customer_id:
                  description: Your customer ID, assigned to you by Telesign.
                  type: string
                reference_id:
                  type: string
                  description: A unique, randomly generated hex value that identifies your web service request.
                  example: DEF0123456789ABCDEF0123456789
                unknown_caller_id:
                  description: The caller ID that was not recognized.
                  type: string
              required:
              - reference_id
              - unknown_caller_id
