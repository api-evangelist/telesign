openapi: 3.2.0
info:
  title: Telesign Finalize API
  version: '1.0'
  contact:
    name: Telesign Customer Support Team
    email: support@telesign.com
  description: 'Operations tagged Finalize across 2 of this provider''s published API definitions: telesign-app-verify-api-openapi.json, telesign-silent-verify-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest-ww.telesign.com
- url: https://verify.telesign.com
security:
- Basic: []
tags:
- name: Finalize
paths:
  /v1/verify/auto/voice/finalize:
    post:
      description: 'Use this endpoint to terminate a call created using the Telesign App Verify API if the handset does not terminate the call in your application.


        To add this product to your account, contact a Telesign expert. This product is available for full-service accounts only.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) and Digest

        * **Encoding:** Accepts only UTF-8 encoded unicode characters as inputs

        * **Accepts:** `application/x-www-form-urlencoded`

        * **Required headers:** `Content-Type - application/x-www-form-urlencoded`

        * **Rate limit:** Default rate limits by product'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                reference_id:
                  description: The reference identifier that Telesign generates and returns in its response to your verify/call service request. This value uniquely identifies each Telesign web service request. [Example] `reference_id=ABCDEF0123456789ABCDEF0123456789`
                  type: string
                verify_code:
                  description: Caller ID parsed by app from the caller id displayed on the device.
                  type: string
              required:
              - reference_id
      responses:
        '200':
          description: "Your request was fulfilled and resulted in a new resource being created. If you want to code against a response, you should retrieve the status or error code and use that rather than the HTTP status response. \n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/finalize-av-response'
              examples:
                Response:
                  value:
                    resource_uri: /v1/verify/6656E61D9674045C91D417A1EC38210A
                    reference_id: 0123456789ABCDEF0123456789ABCDEF
                    sub_resource: auto_verify_finalize
                    errors: []
                    status:
                      updated_on: '2025-03-21T16:27:03.473939Z'
                      code: 2401
                      description: Success
                    verify_code: '69816'
