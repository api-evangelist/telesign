openapi: 3.2.0
info:
  version: '1.0'
  title: Engage Messaging API
  description: This spec contains details about the Telesign Engage API.
  contact:
    name: Telesign Customer Support Team
    email: support@telesign.com
servers:
- url: https://rest-ww.telesign.com
security:
- Basic: []
tags:
- name: Messaging
paths:
  /v1/omnichannel:
    post:
      responses:
        '200':
          description: "**Success.** Your request was fulfilled and resulted in a message being sent. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.\n \n | Status Code | Text String | Description |\n |-------------|-------------|-------------|\n | 3001     | Message in progress  | Telesign successfully received this message request and is processing it. (Intermediate)|\n \n \n \n "
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_id:
                    type: string
                    example: 35C8B5D509BC10689196FED2AD551B8A
                    description: A unique, 32-digit hex value randomly generated by Telesign to identify this request.
                  status:
                    type: object
                    description: Contains properties related to the request status.
                    required:
                    - code
                    - description
                    properties:
                      code:
                        type: integer
                        example: 3001
                        description: 'This code describes the status of your transaction. You can use this code to programmatically respond. This can be either a status code or an error code. '
                      description:
                        type: string
                        example: Message in progress
                        description: A text description of the status code.
                  external_id:
                    type: string
                    example: MKT432538
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    default: MKT432538
                required:
                - reference_id
                - status
                - external_id
              examples:
                response:
                  value:
                    reference_id: 35C8B5D509BC10689196FED2AD551B8A
                    status:
                      code: 3001
                      description: Message in progress
                    external_id: MKT432538
        '400':
          description: "**Bad request.** The request could not be understood by the server due to malformed syntax. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.\n\n | Status Code | Text String | Description |\n |-------------|------------------------|--|\n |3102|Invalid value for parameter message_type: {message_type}|The value of parameter `message_type` is not one of the supported values: `ARN`, `MKT`, `OTP`. (Final)|\n |3103|Unsupported value for parameter external_id: {external_id}|The value of parameter `external_id` is longer than 100 or contains non-ASCII characters. (Final)|\n |3104|Invalid value for parameter account_lifecycle_event: {account_lifecycle_event}|The value of parameter `account_lifecycle_event` is not one of the supported values: `create`, `sign-in`, `transact`, `update`, `delete`. (Final)|\n |3105|Invalid value for parameter originating_ip: {originating_ip}|Parameter originating_ip is improperly formatted. (Final)|\n |  3106 |Invalid value for parameter callback_url: {callback_url}|The value of parameter `callback_url` is empty. (Final)|\n |  3110  |Invalid request|The API request or its JSON payload is improperly formatted. (Final)|\n |  3113  |Invalid value for parameter channel: {channels}|The value of the parameter `channels` contains the same `channel` more than once or is improperly formatted. (Final)|\n  |  3116  |Payload limit size exceeded|Allowed payload size is limited to 10KB |\n |  3300  |Missing parameter channels|The API request does not contain mandatory parameter `channels`. (Final)|\n |  3301  |Missing parameter channel|The value of the parameter `channels` does not contain any instances of the mandatory sub-property `channel`. (Final)|\n |  3302  |Missing parameter phone_number|The API request does not contain the mandatory parameter `phone_number`. (Final)|\n |  3303  |Missing parameter message|The  API request does not contain the mandatory parameter `message`. (Final)|\n |  3304  |Missing parameter message_type|The API request does not contain the mandatory parameter `message_type`. (Final)|"
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_id:
                    type: string
                    example: 35C8B5D509BC10689196FED2AD551B8A
                    description: A unique, 32-digit hex value randomly generated by Telesign to identify this request.
                  status:
                    type: object
                    description: Contains properties related to the request status.
                    required:
                    - code
                    - description
                    properties:
                      code:
                        type: integer
                        example: 3001
                        description: "This code describes the status of your transaction. You can use this code to programmatically respond. This can be either a status code or an error code. \n"
                      description:
                        type: string
                        example: Message in progress
                        description: 'A text description of the status code.

                          '
                  external_id:
                    type: string
                    example: MKT432538
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    default: 'null'
                required:
                - reference_id
                - status
                - external_id
              examples:
                response:
                  value:
                    reference_id: 35C8B5D509BC10689196FED2AD551B8A
                    status:
                      code: 3102
                      description: 'Invalid value for parameter message_type: {message_type}'
                    external_id: MKT432538
        '401':
          description: "**Unauthorized.** The request requires user authentication. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.\n\n | Status Code | Text String | Description|\n |-------------|------------------------|--|\n | 3400       | Not authorized |No permissions for this resource or authorization failed. (Final)|"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    description: Contains properties related to the request status.
                    required:
                    - code
                    - description
                    properties:
                      code:
                        type: integer
                        example: 3400
                        description: "This code describes the status of your transaction. You can use this code to programmatically respond. This can be either a status code or an error code. \n"
                      description:
                        type: string
                        example: Not authorized
                        description: A text description of the status code.
                  external_id:
                    type:
                    - string
                    - 'null'
                    example: MKT432538
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    default: null
                required:
                - status
                - external_id
              examples:
                response:
                  value:
                    status:
                      code: 3400
                      description: Not authorized
                    external_id: MKT432538
        '413':
          description: Request entity too large. Allowed payload size is limited to 10KB.
        '429':
          description: "**Too many requests.** The user sent too many requests in a given amount of time. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.\n\n | Status code | Text string | Description |\n |-------------|-------------|-------------|\n | 3203 |Callback URL parameter not enabled for Customer ID|Using `callback_url` in the API request is not allowed for this customer. (Final)|\n | 3204 |Rate limit exceeded|Allowed number of requests per second to the Telesign Messaging API has been exceeded. (Final)|\n | 3206\t|Omnichnnel Product not enabled for Customer ID|Telesign Messaging is not enabled for this customer. (Final)|"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    description: Contains properties related to the request status.
                    required:
                    - code
                    - description
                    properties:
                      code:
                        type: integer
                        example: 3400
                        description: "This code describes the status of your transaction. You can use this code to programmatically respond. This can be either a status code or an error code. \n"
                      description:
                        type: string
                        example: Not authorized
                        description: A text description of the status code.
                  external_id:
                    type: string
                    example: MKT432538
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    default: 'null'
                required:
                - status
                - external_id
              examples:
                response:
                  value:
                    status:
                      code: 3203
                      description: Callback URL parameter not enabled for Customer ID
                    external_id: MKT432538
        '503':
          description: "**Service unavailable.** The system is unavailable, try again. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.\n\n | Status Code | Text String | Description|\n |-------------|------------------------|--|\n | 3500 |System Unavailable|The system is currently unavailable. The request should be resubmitted. (Final)|"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    description: Contains properties related to the request status.
                    required:
                    - code
                    - description
                    properties:
                      code:
                        type: integer
                        example: 3400
                        description: "This code describes the status of your transaction. You can use this code to programmatically respond. This can be either a status code or an error code. \n"
                      description:
                        type: string
                        example: Not authorized
                        description: A text description of the status code.
                  external_id:
                    type: string
                    example: MKT432538
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    default: 'null'
                required:
                - status
                - external_id
              examples:
                response:
                  value:
                    status:
                      code: 3500
                      description: System Unavailable
                    external_id: MKT432538
      description: 'Use this action to send a message with advanced features through your specified channel (optionally with cascading backup channels) to a recipient phone number or email address.


        To add this product to your account, contact a Telesign expert. This product is available for full-service accounts only.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) or Digest

        * **Encoding:** Accepts only **UTF-8 unicode** characters as inputs.

        * **Accepts:** `application/json`

        * **Responds with:** `application/json`

        * **Rate limit:** Default rate limits by product'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  description: All the potential channels you want the service to be able to try and details on how to use those channels. If the first channel attempted fails, you have specified a fallback channel, and the fallback timeout has elapsed, the service looks to the next channel object here for details on what to do.
                  items:
                    $ref: '#/components/schemas/OmniReqChannelObj'
                recipient:
                  $ref: '#/components/schemas/OmniReqRecipient'
                message:
                  type: object
                  description: Contains properties specifying to the service how to construct the message for each channel. There should be one object in here for each channel, plus a default object with configuration to be applied if none of the specified channels can be used.
                  properties:
                    rcs:
                      $ref: '#/components/schemas/OmniReqDetailsForRCS'
                    whatsapp:
                      $ref: '#/components/schemas/OmniReqDetailsForWA'
                    viber:
                      $ref: '#/components/schemas/OmniReqDetailsForViber'
                    mms:
                      $ref: '#/components/schemas/OmniReqDetailsForMMS'
                    sms:
                      $ref: '#/components/schemas/OmniReqDetailsForSMS'
                    email:
                      $ref: '#/components/schemas/OmniReqDetailsForEmail'
                    default:
                      $ref: '#/components/schemas/OmniReqDetailsForDefault'
                message_type:
                  type: string
                  enum:
                  - ARN
                  - MKT
                  - OTP
                  example: ARN
                  description: The purpose for which the message is being sent. Choose from `OTP` - one-time passwords, `ARN` - alerts, reminders, and notifications, or `MKT` - marketing messages.
                external_id:
                  type: string
                  description: Your own identifier, used to refer to this transaction.
                  maxLength: 100
                  example: MKT432538
                callback_url:
                  type: string
                  description: Your URL that you want Telesign to send callbacks to for this transaction. Overrides any previously set callback URL for your account.
                  example: https://acme.co/mkt_omni_callbacks
                account_lifecycle_event:
                  type: string
                  description: "The phase of the customer life-cycle the end user is in when this transaction is sent. Choices include: \n* `create` - Create a new account. \n* `sign-in` - End user signs-in to their account. \n* `transact` - End user completes a transaction. \n* `update` - End user updates contact details or other info related to their account. \n* `delete` - Delete an account. \n"
                  enum:
                  - create
                  - sign-in
                  - transact
                  - update
                  - delete
                sender_id:
                  type: string
                  example: '15558675310'
                  description: Specifies the  [sender ID](https://support.telesign.com/s/article/What-is-a-Sender-ID) to be displayed to the end user on the generated message. Before using this, give any sender IDs you might want to use to our Customer Support Team, so we can add them to our allow list. If the sender ID in this field is not on this list, it is not used. We do not guarantee that the sender ID you specify will be used; Telesign may override this value to improve delivery quality or to follow the regulations of particular countries.
                originating_ip:
                  type: string
                  description: "The IP address of the end user the message is sent to. Must be in the format defined by the Internet Engineering Task Force (IETF). \n"
                  example: 160.199.219.47
                phone_number:
                  type: string
                  example: '15558675309'
                  deprecated: true
                  description: The end user's phone number you want to send this message to, as digits without spaces or special characters, beginning with the country dialing code. If the `recipient` parameter is not included in this request, this parameter is required.
              required:
              - channels
              - message
              - message_type
        x-examples:
          application/json:
            channels:
            - channel: rcs
              fallback_time: 600
            - channel: whatsapp
              fallback_time: 600
            - channel: sms
            phone_number: '15558675309'
            message:
              rcs:
                template: url_action
                parameters:
                  text: All purchases today are 20% off!
                  url_text: See all deals here.
                  url_id: mktUrl1
                  url: https://acme.co/summer_deals
              default:
                template: text
                parameters:
                  text: All purchases today are 20% off!
            message_type: MKT
            external_id: MKT432538
            callback_URL: https://acme.co/mkt_omni_callbacks
            sender_id: '15558675310'
            originating_ip: 160.199.219.47
      summary: Send a message with advanced features
      operationId: sendAdvancedMessage
      parameters:
      - schema:
          type: string
        in: header
        name: Content-Type - application/json
      tags:
      - Messaging
  /capability/{channel}/{phone_number}:
    parameters:
    - schema:
        type: string
      name: phone_number
      in: path
      required: true
      description: The phone number that the service should check for capability to use the specified channel.
    - schema:
        type: string
        enum:
        - rcs
      name: channel
      in: path
      required: true
      description: The service checks the phone number for capability to use this channel.
    get:
      summary: Check channel-capability of a phone number
      tags:
      - Messaging
      responses:
        '200':
          $ref: '#/components/responses/SharedMsgCapCheck200Res'
        '400':
          $ref: '#/components/responses/SharedMsgCapCheck400Res'
        '401':
          $ref: '#/components/responses/SharedMsgCapCheck401Res'
        '429':
          $ref: '#/components/responses/SharedMsgCapCheck429Res'
        '503':
          $ref: '#/components/responses/SharedMsgCapCheck503Res'
      operationId: checkPhoneNumberChannelCapability
      description: 'Use this action to check capability of a phone number to use the specified channel.


        To enable this feature for your account, contact our Customer Support Team.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) or Digest

        * **Encoding:** Accepts only **UTF-8 unicode** characters as inputs.

        * **Responds with:** `application/json`

        * **Rate limit:** Default rate limits by product'
  /capability/rcs/{phone_number}/{agent_id}:
    parameters:
    - schema:
        type: string
      name: phone_number
      in: path
      required: true
      description: The phone number that the service should check for capability to receive messages from the specified RBM agent.
    - schema:
        type: string
        maxLength: 20
        example: my_rbm_id
      name: agent_id
      in: path
      required: true
      description: Narrows the check to the phone number's capability to use the RBM agent specified by this unique identifier.
    get:
      summary: Check capability of a phone number for an RBM agent
      tags:
      - Messaging
      responses:
        '200':
          $ref: '#/components/responses/SharedMsgCapCheck200Res'
        '400':
          $ref: '#/components/responses/SharedMsgCapCheck400Res'
        '401':
          $ref: '#/components/responses/SharedMsgCapCheck401Res'
        '429':
          $ref: '#/components/responses/SharedMsgCapCheck429Res'
        '503':
          $ref: '#/components/responses/SharedMsgCapCheck503Res'
      operationId: checkPhoneNumberRBMCapability
      description: 'Use this action to check capability of a phone number to receive messages from the specified RBM agent.


        To enable this feature for your account, contact our Customer Support Team.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) or Digest

        * **Encoding:** Accepts only **UTF-8 unicode** characters as inputs.

        * **Responds with:** `application/json`

        * **Rate limit:** Default rate limits by product'
  /v1/omnichannel/{reference_id}:
    parameters:
    - schema:
        type: string
      name: reference_id
      in: path
      required: true
      description: A unique identifier you can use to query Messaging to find out the status of your transaction.
    get:
      summary: Get transaction status
      tags:
      - Messaging
      responses:
        '200':
          description: '**Success.** Your request was fulfilled and resulted in a new resource being created. If you want to code against a response, you should retrieve the status or error code and use that rather than the HTTP status response.


            | Status Code | Associated Text String | Description                                      |

            |-------------|------------------------|--------------------------------------------------|

            | 3002 | Delivered to Gateway | The message is in the process of delivery. Once all delivery options are exhausted, the status will be updated. (Intermediate) |

            | 3000 | Delivered | The message was delivered to the end user. (Final if the last channel used doesn''t support Read status. Intermediate otherwise) |

            | 3003 | Delivery error | The message could not be delivered to the end-user. (Final) |

            | 3005 | Message is read | The message has been read by the end user. (Final) |

            | 3006 | None of the channels is enabled for the customer | None of the channels specified in the request is enabled for the customer or has valid value. (Final) |'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_id:
                    type: string
                    description: A unique, 32-digit hex value randomly generated by Telesign to identify this request.
                    example: 0123456789ABCDEF0123456789ABCDEF
                  external_id:
                    type: string
                    description: Your own identifier, used to refer to this transaction. If you did not supply an external ID in your request, the value of this response property is `null`.
                    example: 7c8832a1-ab0c-4f12-89f3-0bfbfb7f9645
                  status:
                    allOf:
                    - $ref: '#/components/schemas/SlimStatus'
                    - type: object
                      properties:
                        last_channel:
                          type: string
                          description: The name of the channel, or the last channel from `channel_status` array.
                          example: sms
                        updated_on:
                          type: string
                          description: A timestamp showing when your transaction status was updated last.
                          example: 2020-05-04 22:07:01:226
                      required:
                      - last_channel
                      - updated_on
                    description: Contains details about the request status.
                  additional_info:
                    type: object
                    description: Contains properties about mobile country code and the mobile network code associated with the mobile device.
                    properties:
                      price:
                        type: string
                        description: 'The cost incurred for sending the message. For the `sms` channel, this field is present if “Send customer price” (SMS feature) and “Report Enrichment Enabled” (Messaging feature) are enabled for your account. For other channels, this field is present if “Send Price in DLR” (Channel feature) and “Report Enrichment Enabled” (Messaging feature) are enabled for your account. '
                        example: '0.0050'
                      currency:
                        type: string
                        example: USD
                        description: The currency in which the price is expressed (e.g., 'USD'). This field is present if the 'Report Enrichment Enabled' feature is active on your account.
                      mcc:
                        type: string
                        description: Returns the mobile country code (MCC) for the current carrier associated with the mobile device if this feature is enabled for Messaging. The MCC is used in conjunction with the mobile network code (MNC) to uniquely identify a carrier.
                        example: '310'
                      mnc:
                        type: string
                        description: Returns the mobile network code (MNC) value(s) for the current carrier associated with the device if this feature is enabled for Messaging. The MNC is used in conjunction with the mobile country code (MCC) to uniquely identify a carrier.
                        example: '012'
                  verify:
                    type: object
                    description: Contains properties about the status of the verification attempt by the end user (if any). Only returned in the get transaction status response when an OTP code is auto-generated by Telesign.
                    properties:
                      code_state:
                        type: string
                        example: VALID
                        description: 'Indicates whether the verification code you provided in your request matches that sent by Telesign to the end user. Possible values are:

                          * `VALID` - The codes match. The offered code is valid. Used for get transaction status by reference ID and OTP code.

                          * `INVALID` - The codes do not match and the offered code is not valid. Used for get transaction status by reference ID and OTP code.

                          * `UNKNOWN` - Any other state. Used for get transaction status by reference ID.'
                      code_entered:
                        type: string
                        description: 'When an OTP code is auto-generated by Telesign (eg. get transactio status by reference ID and OTP code), If the end user entered a code, what they entered is provided here. When get transaction status by reference ID is used, `null` is returned instead. '
                        example: '9321041'
                    required:
                    - code_state
                    - code_entered
                  channel_status:
                    type: array
                    description: Contains details about the status of each channel specified for sending OTP codes.
                    items:
                      type: object
                      properties:
                        viber:
                          type: object
                          description: Contains details about the status of the viber channel if specified for sending OTP codes.
                          properties:
                            code:
                              type: integer
                              description: The status code that pertains to the channel.
                              example: 3000
                            description:
                              type: string
                              description: The description for the channel's status code.
                              example: Delivered
                            reference_id:
                              type: string
                              description: A unique, randomly generated hex value that identifies your web service request. In case of channel status code 3001, reference_id will not be returned.
                              example: 0123456789ABCDEF0123456789ABCDEF
                            updated_on:
                              type: string
                              description: The timestamp indicating when the transaction status is logged.
                              example: 2020-05-04 22:07:01:226
                          required:
                          - code
                          - description
                          - updated_on
                        whatsapp:
                          type: object
                          description: Contains details about the status of the whatsapp channel if specified for sending OTP codes.
                          properties:
                            code:
                              type: integer
                              description: The status code that pertains to the channel.
                              example: 3000
                            description:
                              type: string
                              description: The description for the channel's status code.
                              example: Delivered
                            reference_id:
                              type: string
                              description: A unique, randomly generated hex value that identifies your web service request. In case of channel status code 3001, reference_id will not be returned.
                              example: 0123456789ABCDEF0123456789ABCDEF
                            updated_on:
                              type: string
                              description: The timestamp indicating when the transaction status is logged.
                              example: 2020-05-04 22:07:01:226
                          required:
                          - code
                          - description
                          - updated_on
                        rcs:
                          type: object
                          description: Contains details about the status of the rcs channel if specified for sending OTP codes.
                          properties:
                            code:
                              type: integer
                              description: The status code that pertains to the channel.
                              example: 3000
                            description:
                              type: string
                              description: The description for the channel's status code.
                              example: Delivered
                            reference_id:
                              type: string
                              description: A unique, randomly generated hex value that identifies your web service request. In case of channel status code 3001, reference_id will not be returned.
                              example: 0123456789ABCDEF0123456789ABCDEF
                            updated_on:
                              type: string
                              description: The timestamp indicating when the transaction status is logged.
                              example: 2020-05-04 22:07:01:226
                          required:
                          - code
                          - description
                          - updated_on
                        sms:
                          type: object
                          description: Contains details about the status of the sms channel if specified for sending OTP codes.
                          properties:
                            code:
                              type: integer
                              description: The status code that pertains to the channel.
                              example: 3000
                            description:
                              type: string
                              description: The description for the channel's status code.
                              example: Delivered
                            reference_id:
                              type: string
                              description: A unique, randomly generated hex value that identifies your web service request. In case of channel status code 3001, reference_id will not be returned.
                              example: 0123456789ABCDEF0123456789ABCDEF
                            updated_on:
                              type: string
                              description: The timestamp indicating when the transaction status is logged.
                              example: 2020-05-04 22:07:01:226
                          required:
                          - code
                          - description
                          - updated_on
                        email:
                          type: object
                          description: Contains details about the status of the email channel if specified for sending OTP codes.
                          properties:
                            code:
                              type: integer
                              description: The status code that pertains to the channel.
                              example: 3000
                            description:
                              type: string
                              description: The description for the channel's status code.
                              example: Delivered
                            reference_id:
                              type: string
                              description: A unique, randomly generated hex value that identifies your web service request. In case of channel status code 3001, reference_id will not be returned.
                              example: 0123456789ABCDEF0123456789ABCDEF
                            updated_on:
                              type: string
                              description: The timestamp indicating when the transaction status is logged.
                              example: 2020-05-04 22:07:01:226
                          required:
                          - code
                          - description
                          - updated_on
                required:
                - reference_id
                - additional_info
                - channel_status
              examples:
                By reference ID with auto-generated OTP:
                  value:
                    status:
                      updated_on: '2024-11-12T13:08:37.000000Z'
                      code: 3000
                      description: Delivered
                      last_channel: whatsapp
                    reference_id: 364C81F5F3D0020C91E7A731DE93A777
