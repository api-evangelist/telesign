      operationId: getMessagingStatus
      description: 'Get delivery status and other details for a Telesign Messaging transaction that you have created. Get transaction status can be used for all Messaging API transactions. Also use this endpoint to complete verification, if Telesign generated your code.


        To enable this feature for your account, contact our Customer Support Team.


        ## General requirements

        * **Authentication:** Basic (easiest to implement) or Digest

        * **Encoding:** Accepts only **UTF-8 unicode** characters as inputs.

        * **Responds with:** `application/json`

        * **Rate limit:** Default rate limits by product'
      parameters:
      - schema:
          type: string
          example: '57244'
        in: query
        description: 'If Telesign generated the code sent to your end user, include the asserted verification code from your end user here. '
        name: verify_code
components:
  schemas:
    OmniReqChannelObj:
      type: object
      description: Specifies a potential channel to use when sending this message, and any other details related to use of that channel.
      title: OmniReqChannelObj
      properties:
        channel:
          type: string
          description: A potential channel you want the service to use for sending this message. The order in which channels are tried depends on the order they are defined in the request. For example, if you specify `rcs` and then `sms`, the service tries RCS and then attempts to use SMS as a fallback if the RCS message fails.
          enum:
          - rcs
          - whatsapp
          - sms
          - mms
          - viber
          - email
        fallback_time:
          type: integer
          description: The duration of time (in seconds) that the service should wait before it concludes that the message has failed on this channel and attempts to send on the backup channel if one is provided.
          default: 300
          example: 600
          minimum: 30
          maximum: 3600
      required:
      - channel
    OmniReqDetailsForEmail:
      title: OmniReqDetailsForEmail
      type: object
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          maxLength: 64
          description: The name of the custom template to use for this message.
          example: your-custom-template-name
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on what is defined in your custom template.
    OmniReqDetailsForRCS:
      type: object
      title: OmniReqDetailsForRCS
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          example: url_action
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            text:
              type: string
              description: The main text of your message. <br/>**Required for:** `text`,`dial_action`,`url_action`,`2_suggested_replies`, `3_suggested_replies` templates.
              example: All purchases today are 20% off!
            button_text_1:
              type: string
              description: The text of the first suggested reply. <br/>**Required for:** `2_suggested_replies`, `3_suggested_replies` templates.
              example: 'Yes'
            button_payload_1:
              type: string
              description: Unique identifier for the first reply. <br/>**Required for:** `2_suggested_replies`, `3_suggested_replies` templates.
              example: r1id
            button_text_2:
              type: string
              description: The text of the second suggested reply. <br/>**Required for:** `2_suggested_replies`, `3_suggested_replies` templates.
              example: 'No'
            button_payload_2:
              type: string
              description: Unique identifier for the second reply. <br/>**Required for:** `2_suggested_replies`, `3_suggested_replies` templates.
              example: r2id
            button_text_3:
              type: string
              description: The text of the third suggested reply. <br/>**Required for:** `3_suggested_replies` template.
              example: Not sure
            button_payload_3:
              type: string
              description: Unique identifier for the third reply. <br/>**Required for:** `3_suggested_replies` template.
              example: r3id
            url_text:
              type: string
              description: Text for the link in the message. <br/>**Required for:** `url_action`, `rc_url_action_vertical`, `rc_url_action_horizontal` templates.
              example: See all deals here.
            url_payload:
              type: string
              description: Unique identifier for the link in the message. <br/>**Required for:** `url_action`, `rc_url_action_vertical`, `rc_url_action_horizontal` templates.
              example: mktUrl1
            url:
              type: string
              description: "Depending on the template being used, this is either the URL for the link in the message or the URL for a media file or file attachment to embed in the message. <br/>**Required for:** \n`media`, `url_action`, `rc_url_action_vertical`, `rc_url_action_horizontal`, `file`"
              example: https://acme.co/summer_deals
            dial_text:
              type: string
              description: Text on the click-to-call button. <br/>**Required for:** `dial_action`, `rc_dial_action_vertical`, `rc_dial_action_horizontal` templates.
              example: Call agent
            phone_number_to_dial:
              type: string
              description: The complete phone number to call when the button is selected. Include `+` at the beginning of international numbers. <br/>**Required for:** `dial_action`, `rc_dial_action_vertical`, `rc_dial_action_horizontal` templates.
              example: '+15555551212'
            dial_payload:
              type: string
              description: Unique identifier for the click-to-call phone number in the message. <br/>**Required for:** `dial_action`, `rc_dial_action_vertical`, `rc_dial_action_horizontal` templates.
              example: dial_id
            media_url:
              type: string
              description: 'The URL reference for the image to include in the rich card in your message.  <br/>

                **Required for:** `rc_url_action_vertical`, `rc_dial_action_vertical`, `rc_url_action_horizontal`, `rc_dial_action_horizontal` templates.'
              example: https://s3.amazonaws.com/acmeco-content/group_photo.jpg
            latitude:
              type: string
              example: '37.423021'
              description: "The latitude coordinate of your location as a positive or negative number.<br/>**Required for:** \n`location`"
            longitude:
              type: string
              example: '-122.083739'
              description: "The longitude coordinate of your location as a positive or negative number.<br/>**Required for:** \n`location`"
    OmniReqDetailsForWA:
      type: object
      title: OmniReqDetailsForWA
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          example: url_action
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            text:
              type: string
              example: All purchases today are 20% off!
              description: The main text of your message. <br/>**Required for:** `text`
            header_url:
              type: string
              example: https://acme.co/summer_deals.png
              description: "The source URL for a media file or file attachment to embed in the message. <br/>**Required for:** \n`image`, `video`, `audio`, `file`"
            file_name:
              type: string
              example: Instruction for payment.pdf
              description: "The display name of the file on end-user device. If you do not include a value for this parameter, the service uses a default value of \"file\". <br/>**Required for:** \n`file`"
            latitude:
              type: string
              example: '37.423021'
              description: "The latitude coordinate of your location (number only).<br/>**Required for:** \n`location`"
            longitude:
              type: string
              example: '-122.083739'
              description: "The longitude coordinate of your location (number only).<br/>**Required for:** \n`location`"
    OmniReqDetailsForMMS:
      type: object
      title: OmniReqDetailsForMMS
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          example: image
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            url:
              type: string
              description: "The source URL for a media file to embed in the message. <br/>**Required for:** \n`image`, `video`, `audio`"
              example: https://acme.co/summer_deals.png
    MsgGetStatusRes:
      title: MsgGetStatusRes
      allOf:
      - properties:
          status:
            type: object
            properties:
              code:
                type: integer
                description: Corresponding status code in case of failure.
              description:
                type: string
                description: Corresponding status description in case of failure.
            required:
            - code
            - description
      type: object
    OmniReqDetailsForDefault:
      type: object
      title: OmniReqDetailsForDefault
      description: Contains properties specifying to the service how to construct the message for any channel where the equivalent details under `message` are not provided for it.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          example: text
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            text:
              type: string
              description: The main text of your message. <br/>**Required for:** `text`,`dial_action`,`url_action`,`2_suggested_replies`, `3_suggested_replies` templates.
              example: All purchases today are 20% off!
    OmniReqDetailsForSMS:
      type: object
      title: OmniReqDetailsForSMS
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          example: text
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            text:
              type: string
              description: The main text of your message. <br/>**Required for:** `text`,`dial_action`,`url_action`,`2_suggested_replies`, `3_suggested_replies` templates.
              example: All purchases today are 20% off!
    OmniReqRecipient:
      title: OmniReqRecipient
      type: object
      description: Contains properties specifying the contact information needed to communicate with a recipient for a particular channel. At least one sub-property must be included. If the `phone_number` parameter is not included in this request, this parameter is required.
      properties:
        phone_number:
          type: string
          description: The recipient's phone number, as digits without spaces or special characters, beginning with the country dialing code. **Required if RCS, SMS, WA, Viber, or MMS is selected as the channel.**
          example: '11234567890'
        email:
          type: string
          description: The recipient's email address. **Required if email is selected as the channel.**
          example: jsmith@vero-finto.com
    SharedResponseSlim:
      title: SharedResponseSlim
      type: object
      properties:
        reference_id:
          type: string
          example: 0123456789ABCDEF0123456789ABCDEF
          description: A unique, randomly generated hex value that identifies your web service request.
        status:
          $ref: '#/components/schemas/SlimStatus'
      required:
      - reference_id
      - status
    OmniReqDetailsForViber:
      type: object
      title: OmniReqDetailsForViber
      description: Contains properties specifying to the service how to construct the message for this channel.
      properties:
        template:
          type: string
          description: The name of the template to use for this message.
          enum:
          - text
          - text_session
          - image
          - image_session
          - video
          - text_video
          - url_action_video
          - url_action
          - otp_verify
        parameters:
          type: object
          description: Contains sub-properties with values for variables in the message template. Which sub-properties to include here depends on which template you have selected.
          properties:
            text:
              type: string
              example: All purchases today are 20% off!
              description: The main text of your message. <br/>**Required for:** `text`, `text_session`, `url_action`,  `text_video` and `url_action_video`.
            url:
              type: string
              example: https://vero-finto/summer_deals.png
              description: "Depending on the template being used, this is the URL for the link in the message or the URL where you are hosting an image or video file in the message.<br/>**Required for:** \n`image`, `image_session`, `url_action`, `video`, `text_video`, and `url_action_video`."
            url_id:
              type: string
              description: Unique identifier for the link in the message. **Required for:** `url_action`
              example: mktUrl1
            url_text:
              type: string
              example: Learn more about our deals here.
              description: Text for the link button in the message. <br/>**Required for:** `url_action`
            open_url:
              type: string
              description: 'The URL end users are directed to or the action performed when pressing the action button. '
              example: https://example.com/vero-finto/video_placeholder_name.jpg
            url_thumbnail:
              type: string
              description: A static image that acts as the preview image for the video. <br/>**Required for:** `text_video`.
              example: https://vero-finto-test.com
            otp_code:
              type: string
              description: The OTP code of your verified template message. <br/>**Required for:** `otp_verify`
              example: '12345'
            language:
              type: string
              example: en
              description: ISO 639-1 two-letter language code. For more details, see [Messaging - Send Viber verification message](/enterprise/docs/messaging-send-viber-verification-message). If not specified, the default value will be English language. <br/>**Optional for:** `otp_verify`
            reply_id:
              type: string
              description: This is sent back to the provider when a message sent to a end user is answered. The end user’s reply is linked to the tracking data value that is set in the request.
              example: nxjs634!
            button_text:
              type: string
              description: 'The text that appears on the action button. '
              example: Click here for video
    SlimStatus:
      title: SlimStatus
      type: object
      properties:
        code:
          type: integer
          description: A numeric code that indicates the status of your transaction.
          example: 290
        description:
          type: string
          description: Text describing the status of your transaction.
          example: Message in progress
      required:
      - code
      - description
  responses:
    SharedMsgCapCheck401Res:
      description: '**Unauthorized.** The request requires user authentication. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.


        Status code | Text string | Description

        --|--|--

        3210|Capability Check not enabled for Customer ID|This feature (Capability Check) is not enabled for this Customer ID. (Final)'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/SharedResponseSlim'
            - type: object
              properties:
                status:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 3210
                    description:
                      type: string
                      example: Capability Check not enabled for Customer ID
          examples:
            Example:
              value:
                reference_id: 0123456789ABCDEF0123456789ABCDEF
                status:
                  code: 3210
                  description: Capability Check not enabled for Customer ID
    SharedMsgCapCheck503Res:
      description: '**Service unavailable.** The system is unavailable, try again. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.


        Status code | Text string | Description

        --|--|--

        3041|Carrier rejected - temporary problem|The channel provider failed to respond. The request should be resubmitted.

        3500 | System Unavailable | The system is currently unavailable. The request should be resubmitted. (Final)'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/SharedResponseSlim'
            - type: object
              properties:
                status:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 3041
                    description:
                      type: string
                      example: Carrier rejected - temporary problem
          examples:
            Example:
              value:
                reference_id: 0123456789ABCDEF0123456789ABCDEF
                status:
                  code: 3041
                  description: Carrier rejected - temporary problem
    SharedMsgCapCheck400Res:
      description: '**Bad request.** The request could not be understood by the server due to malformed syntax. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.


        Status code | Text string | Description

        --|--|--

        3109|Invalid value for parameter sender_id: {sender_id}|The value of the sender_id parameter in your request is invalid.

        3110|Invalid request|This API request was not properly formatted. (Final)'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/SharedResponseSlim'
            - type: object
              properties:
                status:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 3110
                    description:
                      type: string
                      example: Invalid request
          examples:
            Example:
              value:
                reference_id: 0123456789ABCDEF0123456789ABCDEF
                status:
                  code: 3110
                  description: Invalid request
    SharedMsgCapCheck429Res:
      description: '**Too many requests.** Too many requests sent to this API in a given amount of time. Code against the Telesign status or error codes from the `status.code` property in the response payload, rather than the HTTP status code of the response.


        Status code | Text string | Description

        --|--|--

        3204|Rate limit exceeded|Allowed number of requests per second on the Telesign Messaging API has been exceeded. (Final)

        '
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/SharedResponseSlim'
            - type: object
              properties:
                status:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 3204
                    description:
                      type: string
                      example: Rate limit exceeded
          examples:
            Example:
              value:
                reference_id: 0123456789ABCDEF0123456789ABCDEF
                status:
                  code: 3204
                  description: Rate limit exceeded
    SharedMsgCapCheck200Res:
      description: '**Success.** The service successfully processed this request. Code against the Telesign `status.code` property in the response payload, rather than the HTTP status code of the response.


        Status code | Text string | Description

        --|--|--

        3055|Delivery channel not supported by the end user''s device|The device associated with this phone number cannot use the selected channel.

        3060|Delivery channel supported by the end user''s device|The device associated with this phone number can use the selected channel.

        3115|Destination phone number not in coverage|The device associated with this phone number can use the selected channel, but it is not in coverage for Telesign Messaging.'
      content:
