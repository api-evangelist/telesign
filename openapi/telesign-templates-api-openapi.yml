      description: One of the Telesign Messaging channels for which programmatic template management is supported.
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
        example: wa_bogo
      description: ' The name of this template.'
  securitySchemes:
    Basic:
      type: http
      description: Easiest to implement. See [Basic Authentication](/enterprise/docs/authentication#basic-authentication) for more details.
      scheme: basic
    Digest:
      type: apiKey
