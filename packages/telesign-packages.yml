note: 'Telesign ships two SDK families per language: a Self-service SDK (SMS, SMS Verify, Phone ID) and a Full-service "enterprise" SDK that wraps the Verify, Voice and Intelligence products. The SDKs apply
  Telesign''s Digest (HMAC) authentication automatically and fall back to Basic where Digest is not supported. No Go, Rust or Swift server package is published; android_sdk_verify and ios_sdk_verify are
  mobile client SDKs for App Verify distributed from GitHub only. Maven Central carries only the self-service Java SDK (com.telesign:telesign); the Java enterprise SDK is distributed from its GitHub releases.'
