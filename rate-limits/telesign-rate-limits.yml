headers_note: No RateLimit-*, X-RateLimit-* or Retry-After response headers are documented; the API reference documents a 429 response whose JSON body carries the Telesign status/error code.
exhaustion:
  http_status: 429
  error_codes:
  - code: -40007
    description: Rate Limit Exceeded
    products: SMS Verify API, Voice Verify API, Number Deactivation, Smart Verify API, Bulk SMS
  - code: 3204
    description: Rate limit exceeded (Omnichannel / Messaging API)
  - code: 5204
    description: Rate limit exceeded (Accounts API)
  - code: 10019
    description: Rate Limit Exceeded (SMS, Phone ID, Intelligence, Silent Verify)
  source: https://developer.telesign.com/enterprise/docs/all-status-and-error-codes
policies:
- name: Capacity adjustments
  description: Higher rate limits are requested from the Customer Support Team with account type, paid or trial status, use case, traffic destinations, products and estimated monthly volume.
