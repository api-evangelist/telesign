provider: Telesign
providerId: telesign
description: >-
  Telesign publishes default per-product rate limits in a support article ("Yes, our products have rate
  limits. The default rate limits that are enabled vary by product but can be adjusted."). Full-service
  (enterprise) and Self-service accounts have different defaults, and every API reference page links to
  this article as "Default rate limits by product". Limits are per customer account per product; higher
  limits are requested through Customer Support. Exhaustion is signalled with HTTP 429 and a product-specific
  Telesign error code in the JSON body rather than a RateLimit-* header.
note: >-
  The support article is a Salesforce Experience Cloud page that renders client-side; it was read through a
  headless browser on 2026-10-07. Row limit_text values are the product name and value as the rendered table
  shows them, with the table footnote recorded in footnote.
footnote: 'Listed values are transactions per second except for Bulk SMS which is requests per minute.'
